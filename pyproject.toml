[project]
name = "study-helper"
version = "0.1.0"
description = "Multi-agent exam-prep study helper"
readme = "README.md"
# Pinned below 3.14: chainlit calls nest_asyncio.apply(), and nest_asyncio
# 1.6.0 breaks asyncio.current_task() on 3.14, which makes sniffio fail to
# detect the loop and every static asset 500. See README.
requires-python = ">=3.13,<3.14"
dependencies = [
    "chainlit>=2.12.0",
    "ddgs>=9.16.0",
    "openai-agents>=0.22.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
study-helper = "study_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_helper"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that hit a live model provider are marked "live" and skipped by
# default: run them with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: needs a real API key and makes model calls"]
asyncio_mode = "auto"
